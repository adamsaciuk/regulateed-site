<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RegulateED: classroom self-regulation, coming soon</title>
<meta name="description" content="RegulateED is a classroom self-regulation app and pediatric occupational therapy program for grades K to 5. Check in, reset in two minutes, back to learning. Coming soon.">
<meta name="theme-color" content="#1F3A4D">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
    :root { --teal: #2A9D8F; --coral: #F2845C; --slate: #1F3A4D; --paper: #FFF8F0; --mint: #7FD3C6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
        font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
        background: var(--slate); color: #fff; min-height: 100vh; display: flex; flex-direction: column;
        --a: #F7A27F; --b: var(--mint); --ink: #fff; --k: var(--slate); --ring: rgba(255,255,255,.22);
    }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 24px 24px; }
    .reggie { width: min(38vw, 170px); margin-bottom: 28px; animation: breathe 4s ease-in-out infinite; transform-origin: 50% 85%; }
    .lockup { width: min(86vw, 520px); }
    h1 { font-size: clamp(26px, 6vw, 44px); line-height: 1.15; margin: 36px 0 14px; letter-spacing: -.5px; }
    p { font-size: clamp(16px, 3.6vw, 20px); line-height: 1.5; max-width: 560px; margin: 0 auto; opacity: .85; }
    .soon { display: inline-block; margin-top: 32px; padding: 10px 22px; border-radius: 99px; background: var(--paper); color: var(--slate); font-weight: 700; letter-spacing: 2px; font-size: 13px; text-transform: uppercase; }
    .steps { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; font-size: 14px; }
    .steps span { border: 1px solid rgba(255,255,255,.25); border-radius: 99px; padding: 6px 14px; opacity: .9; }
    footer { text-align: center; font-size: 13px; opacity: .5; padding: 24px; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .reggie { animation: none; } }
</style>
</head>
<body>
<main>
    <svg class="reggie" viewBox="0 0 100 100" role="img" aria-label="Reggie">
        <path d="M50 18 C50 11 54 7 60 6" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--b)"/>
        <circle cx="61" cy="6" r="3.5" style="fill:var(--a)"/>
        <path d="M50 18 C73 18 86 34 86 56 C86 77 70 88 50 88 C30 88 14 77 14 56 C14 34 27 18 50 18 Z" style="fill:var(--b)"/>
        <path d="M33 52 Q39 46 45 52 M55 52 Q61 46 67 52" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--k)"/>
        <path d="M43 64 Q50 70 57 64" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--k)"/>
        <circle cx="33" cy="62" r="4.5" opacity=".85" style="fill:var(--a)"/>
        <circle cx="67" cy="62" r="4.5" opacity=".85" style="fill:var(--a)"/>
    </svg>
    <svg class="lockup" viewBox="0 0 360 100" role="img" aria-label="RegulateED, classroom self-regulation">
        <circle cx="50" cy="50" r="44" fill="none" stroke-width="4" style="stroke:var(--ring)"/>
        <path d="M14 50 L20 37 L26 62 L32 40 L38 58 L44 50" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--a)">
            <!-- the busy half settles and stirs again, like a breath -->
            <animate class="calm" attributeName="d" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.55;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1"
                values="M14 50 L20 37 L26 62 L32 40 L38 58 L44 50;M14 50 L20 46 L26 54 L32 47 L38 53 L44 50;M14 50 L20 46 L26 54 L32 47 L38 53 L44 50;M14 50 L20 37 L26 62 L32 40 L38 58 L44 50"/>
        </path>
        <path d="M44 50 C51 37 58 37 65 50 S79 63 86 50" fill="none" stroke-width="7" stroke-linecap="round" style="stroke:var(--b)"/>
        <text x="114" y="60" style="font:800 40px 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;letter-spacing:-.5px;fill:var(--ink)">RegulateED</text>
        <text x="116" y="82" style="font:600 10.5px 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;letter-spacing:2.2px;fill:var(--ink);opacity:.65">CLASSROOM SELF-REGULATION</text>
    </svg>
    <h1>Calm in two minutes.<br>Ready to learn.</h1>
    <p>A classroom self-regulation app and pediatric occupational therapy program for grades K to 5. Children check in with their body, take a 2&#8209;minute reset at their desk, and get back to learning.</p>
    <div class="steps"><span>Check in</span><span>Reset</span><span>Re-check</span></div>
    <div class="soon">Coming soon</div>
</main>
<footer>&copy; 2026 RegulateED</footer>
</body>
</html>
